id: dsc_weather
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-distance-sample-counts
    version: "1.0.2.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

rjsf-overrides:
  properties:
    weather_subject_group_name.properties.var.title: "Weather Station Subject Group"
    weather_subject_group_name.properties.var.description: "EarthRanger subject group name containing the weather stations (e.g. TAHMO Stations)."
    weather_subject_group_name.properties.var.default: "TAHMO Stations"

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range

  - name: Set Groupers 
    id: groupers
    task: set_groupers
    partial:
      groupers: []

  - name: Connect to EarthRanger
    id: weather_er_client
    task: set_er_connection

  - name: Subject Group Name
    id: weather_subject_group_name
    task: set_string_var

  - name: Fetch weather station observations
    id: fetch_weather_obs
    task: get_subjectgroup_observations
    partial:
      client: ${{ workflow.weather_er_client.return }}
      subject_group_name: ${{ workflow.weather_subject_group_name.return }}
      time_range: ${{ workflow.time_range.return }}
      filter: clean
      raise_on_empty: false
      include_details: true
      include_subjectsource_details: false

  - name: Extract precipitation
    id: extract_precipitation
    task: extract_value_from_json_column
    partial:
      df: ${{ workflow.fetch_weather_obs.return }}
      column_name: extra__observation_details
      field_name_options:
        - precipitation
      output_type: float
      output_column_name: Precipitation

  - name: Extract temperature
    id: extract_temperature
    task: extract_value_from_json_column
    partial:
      df: ${{ workflow.extract_precipitation.return }}
      column_name: extra__observation_details
      field_name_options:
        - surface_air_temperature
      output_type: float
      output_column_name: Temperature

  - name: Extract humidity
    id: extract_humidity
    task: extract_value_from_json_column
    partial:
      df: ${{ workflow.extract_temperature.return }}
      column_name: extra__observation_details
      field_name_options:
        - relative_humidity
      output_type: float
      output_column_name: Humidity

  - name: Extract wind speed
    id: extract_wind_speed
    task: extract_value_from_json_column
    partial:
      df: ${{ workflow.extract_humidity.return }}
      column_name: extra__observation_details
      field_name_options:
        - wind_speed
      output_type: float
      output_column_name: Windspeed

  # One-time: station -> conservancy boundary file
  - name: Download weather station conservancy boundaries
    id: fetch_conservancy_boundaries
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/xriwdsjeauzd8akk3oc4b/mara_conservancies.parquet?rlkey=lepz395x9jz3podl39vbke0wh&st=aqzdwmt8&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Load conservancy boundaries
    id: load_conservancy_boundaries
    task: load_df
    partial:
      file_path: ${{ workflow.fetch_conservancy_boundaries.return }}
      layer: null
      deserialize_json: false

  - name: Reproject conservancy boundaries to EPSG:4326
    id: reproject_conservancy_boundaries
    task: reproject_gdf
    partial:
      gdf: ${{ workflow.load_conservancy_boundaries.return }}
      target_crs: "EPSG:4326"

  - name: Tag weather stations with their conservancy
    id: weather_conservancy_join
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.spatial_join
    partial:
      left_df: ${{ workflow.extract_wind_speed.return }}
      right_df: ${{ workflow.reproject_conservancy_boundaries.return }}
      how: inner
      predicate: intersects

  - name: Rename station identity columns
    id: rename_weather_identity
    task: map_columns
    partial:
      df: ${{ workflow.weather_conservancy_join.return }}
      raise_if_not_found: false
      drop_columns: []
      retain_columns: []
      rename_columns:
        extra__subject__name: "Station ID"
        name: "Conservancy"

  - name: Extract weather station latitude and longitude
    id: extract_weather_lat_long
    task: parse_df_point
    partial:
      df: ${{ workflow.rename_weather_identity.return }}

  - name: Split weather fixtime into date/time/year
    id: decompose_weather_fixtime
    task: decompose_datetime
    partial:
      df: ${{ workflow.extract_weather_lat_long.return }}
      datetime_column: fixtime
      components:
        - date
        - time
        - year
      remove_source: false
      column_prefix: null

  - name: Rename date/time columns
    id: rename_weather_datetime
    task: map_columns
    partial:
      df: ${{ workflow.decompose_weather_fixtime.return }}
      raise_if_not_found: false
      drop_columns: []
      retain_columns: []
      rename_columns:
        fixtime_date: "Date"
        fixtime_time: "Time"

  # Station metadata: one row per station (join key = Station ID)
  - name: Select station metadata columns
    id: select_station_metadata
    task: select_columns
    partial:
      df: ${{ workflow.rename_weather_datetime.return }}
      columns:
        - "Station ID"
        - "Conservancy"
        - "Latitude"
        - "Longitude"
      raise_on_missing: true

  - name: Deduplicate station metadata to one row per station
    id: dedupe_station_metadata
    task: ecoscope_workflows_ext_distance_sample_counts.tasks.transformation.dedupe_by_column
    partial:
      df: ${{ workflow.select_station_metadata.return }}
      column: "Station ID"

  - name: Persist station metadata
    id: persist_station_metadata
    task: persist_df
    partial:
      df: ${{ workflow.dedupe_station_metadata.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: parquet
      filename: station_metadata

  - name: Render Station Metadata Table
    id: station_metadata_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.dedupe_station_metadata.return }}
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: true
        enable_download: false
        hide_header: false
      widget_id: "Station Metadata"

  - name: Save Station Metadata Table (HTML)
    id: station_metadata_table_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: station_metadata_table
      text: ${{ workflow.station_metadata_table_html.return }}

  - name: Create Station Metadata Table Widget
    id: station_metadata_table_widget
    task: create_table_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Station Metadata"
      data: ${{ workflow.station_metadata_table_html_url.return }}

  # Weather readings: slim per Station ID x Year files, no repeated
  # Conservancy/Latitude/Longitude (join back to station_metadata by Station ID)
  - name: Select weather readings columns
    id: select_weather_readings
    task: select_columns
    partial:
      df: ${{ workflow.rename_weather_datetime.return }}
      columns:
        - "Station ID"
        - "Precipitation"
        - "Humidity"
        - "Temperature"
        - "Windspeed"
        - "fixtime_year"
        - "fixtime"
      raise_on_missing: true

  - name: Split weather readings by station and year
    id: weather_station_year_split
    task: ecoscope_workflows_ext_distance_sample_counts.tasks.transformation.split_weather_by_station_year
    partial:
      df: ${{ workflow.select_weather_readings.return }}
      station_column: "Station ID"
      year_column: "fixtime_year"

  - name: Persist weather readings per station and year
    id: persist_station_year_weather
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: parquet
    mapvalues:
      argnames:
        - filename
        - df
      argvalues: ${{ workflow.weather_station_year_split.return }}

  - name: Render Station Year Weather Table
    id: syw_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.select_weather_readings.return }}
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: true
        enable_download: false
        hide_header: false
      widget_id: "Station Year Weather Data"

  - name: Save Station Year Weather Table (HTML)
    id: syw_table_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: station_year_weather_table
      text: ${{ workflow.syw_table_html.return }}

  - name: Create Station Year Weather Table Widget
    id: syw_table_widget
    task: create_table_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Station Year Weather Data"
      data: ${{ workflow.syw_table_html_url.return }}

  - name: Overall dashboard
    id: overall_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return}}
      widgets:
        - ${{ workflow.station_metadata_table_widget.return }}
        - ${{ workflow.syw_table_widget.return }}
      time_range: ${{ workflow.time_range.return}}
      groupers: ${{ workflow.groupers.return }}